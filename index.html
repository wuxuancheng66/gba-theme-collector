<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>主题构想收集器 · 筑工杯备赛</title>
<meta name="description" content="粤港澳大学生公共治理数据分析大赛·五人主题构想实时收集板">
<style>
  :root{
    --bg:#080d1f; --bg2:#0e1533;
    --card:rgba(255,255,255,.05); --border:rgba(255,255,255,.1);
    --text:#eef1fb; --muted:#9aa5c6;
    --blue:#4f8cff; --violet:#8b5cf6; --cyan:#22d3ee; --gold:#f5b93d; --green:#34d399; --pink:#f472b6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(800px 400px at 85% -5%, rgba(79,140,255,.18), transparent 60%),
      radial-gradient(700px 400px at -10% 25%, rgba(139,92,246,.14), transparent 60%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--text); line-height:1.65; min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:110px;
  }
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(8,13,31,.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border); padding:12px 16px 10px;
  }
  .top-row{display:flex;align-items:center;gap:10px}
  .logo{font-size:16.5px;font-weight:800;letter-spacing:.5px;flex:1;min-width:0}
  .logo .grad{background:linear-gradient(90deg,#7db4ff,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .logo small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px}
  .sync-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex:none}
  .sync-dot.off{background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .sync-dot.err{background:#f87171;box-shadow:0 0 8px #f87171}
  .btn-refresh{
    flex:none;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);
    font-size:12.5px;padding:6px 12px;border-radius:10px;cursor:pointer;
  }
  .btn-refresh:active{transform:scale(.95)}
  .people{display:flex;gap:8px;margin-top:11px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .people::-webkit-scrollbar{display:none}
  .person{
    flex:none;display:flex;align-items:center;gap:7px;padding:6px 12px 6px 7px;border-radius:999px;
    border:1px solid var(--border);background:rgba(255,255,255,.04);cursor:pointer;transition:.15s;
  }
  .person .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
  .person .nm{font-size:13px;color:var(--muted);white-space:nowrap}
  .person .ct{font-size:11px;background:rgba(255,255,255,.1);padding:1px 7px;border-radius:999px;color:var(--muted)}
  .person.sel{border-color:rgba(79,140,255,.6);background:rgba(79,140,255,.13)}
  .person.sel .nm{color:#fff;font-weight:700}
  main{max-width:860px;margin:0 auto;padding:14px 14px 0}
  .empty{
    text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;
    border:1px dashed var(--border);border-radius:18px;margin-top:10px;background:rgba(255,255,255,.02);
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  @media (max-width:640px){.grid{grid-template-columns:1fr}}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px 16px 13px;
    position:relative;overflow:hidden;transition:.15s;
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc,#4f8cff)}
  .card .head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;padding-left:4px}
  .card h3{font-size:15.5px;flex:1;line-height:1.45;word-break:break-all}
  .card .meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin:2px 0 9px 4px;flex-wrap:wrap}
  .card .who{color:var(--pc,#4f8cff);font-weight:700}
  .fields{display:none;padding-left:4px}
  .card.open .fields{display:block}
  .f{margin-bottom:8px}
  .f .k{font-size:11px;color:var(--cyan);letter-spacing:1px;margin-bottom:2px;font-weight:700}
  .f .v{font-size:13.5px;color:#d5ddf3;white-space:pre-wrap;word-break:break-word}
  .toggle{font-size:12px;color:var(--blue);cursor:pointer;padding:4px 0 0 4px;user-select:none}
  .ops{display:flex;gap:8px;margin-top:9px;padding-left:4px}
  .ops button{
    border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--muted);
    font-size:12px;padding:4px 12px;border-radius:8px;cursor:pointer;
  }
  .ops button.del{color:#f8a5a5;border-color:rgba(248,113,113,.3)}
  .ops button:active{transform:scale(.94)}
  /* 示例引导卡 */
  .card.example{border:1px dashed rgba(245,185,61,.55);background:linear-gradient(180deg,rgba(245,185,61,.07),rgba(245,185,61,.02))}
  .card.example::before{background:linear-gradient(180deg,var(--gold),#e8963c)}
  .example-badge{
    display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:1px;
    color:#1a1205;background:linear-gradient(92deg,#ffd982,var(--gold));padding:2px 9px;border-radius:999px;flex:none;
  }
  .example-fields{display:block;padding-left:4px}
  .example-card-tag{font-size:11px;color:var(--gold);margin-top:10px;padding-left:4px;line-height:1.5}
  .bottombar{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:rgba(8,13,31,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;gap:10px;
  }
  .bottombar button{flex:1;border:none;border-radius:13px;padding:13px 0;font-size:15px;font-weight:700;cursor:pointer}
  .btn-new{background:linear-gradient(92deg,var(--blue),var(--violet));color:#fff;box-shadow:0 6px 18px rgba(79,140,255,.35)}
  .btn-export{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border)}
  .bottombar button:active{transform:scale(.97)}
  .modal{
    position:fixed;inset:0;z-index:100;background:rgba(4,7,17,.75);backdrop-filter:blur(6px);
    display:none;align-items:flex-end;justify-content:center;
  }
  .modal.show{display:flex}
  .sheet{
    width:100%;max-width:720px;max-height:92vh;overflow-y:auto;
    background:linear-gradient(180deg,#131b3f,#0d1330);
    border-radius:22px 22px 0 0;border:1px solid var(--border);border-bottom:none;
    padding:18px 18px calc(20px + env(safe-area-inset-bottom));
  }
  @media (min-width:720px){.modal{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--border)}}
  .sheet h3{font-size:17px;margin-bottom:4px}
  .sheet .sub{font-size:12px;color:var(--muted);margin-bottom:16px}
  .fg{margin-bottom:13px}
  .fg label{display:block;font-size:12.5px;font-weight:700;color:#cdd8f5;margin-bottom:5px}
  .fg label small{color:var(--muted);font-weight:400}
  .fg textarea,.fg input{
    width:100%;background:rgba(255,255,255,.055);border:1px solid var(--border);border-radius:12px;
    color:var(--text);font-size:14.5px;padding:11px 13px;font-family:inherit;outline:none;resize:vertical;
  }
  .fg textarea:focus,.fg input:focus{border-color:rgba(79,140,255,.6)}
  .fg textarea{min-height:74px}
  .sheet-actions{display:flex;gap:10px;margin-top:6px}
  .sheet-actions button{flex:1;border:none;border-radius:13px;padding:13px 0;font-size:15px;font-weight:700;cursor:pointer}
  .sa-save{background:linear-gradient(92deg,var(--blue),var(--violet));color:#fff}
  .sa-cancel{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border)}
  .toast{
    position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);z-index:200;
    background:rgba(20,28,60,.95);border:1px solid var(--border);color:#fff;font-size:13.5px;
    padding:10px 20px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;max-width:86vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{border-color:rgba(52,211,153,.5)}
  .toast.err{border-color:rgba(248,113,113,.5)}
  .export-box{width:100%;height:56vh;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;color:#d5ddf3;font-size:12.5px;padding:12px;font-family:inherit;outline:none;white-space:pre-wrap}
</style>
</head>
<body>

<header>
  <div class="top-row">
    <div class="logo">
      <span class="grad">📊 主题构想收集器</span>
      <small>筑工杯第六届 · 五人共创 · 自动同步</small>
    </div>
    <span class="sync-dot" id="syncDot" title="同步状态"></span>
    <button class="btn-refresh" onclick="loadData(true)">刷新</button>
  </div>
  <div class="people" id="peopleBar"></div>
</header>

<main>
  <div class="grid" id="cardsGrid"></div>
  <div class="empty" id="emptyTip" style="display:none">
    还没有任何构想——点击下方「+ 新的构想」<br>写下第一个主题灵感 ✍️
  </div>
</main>

<div class="bottombar">
  <button class="btn-new" onclick="openForm()">＋ 新的构想</button>
  <button class="btn-export" onclick="openExport()">📤 导出汇总</button>
</div>

<div class="modal" id="formModal">
  <div class="sheet">
    <h3 id="formTitle">新的主题构想</h3>
    <div class="sub" id="formSub"></div>
    <div class="fg"><label>主题名 <small>· 必填</small></label><input id="f-title" placeholder="例如：AI 客服替代政务热线的服务效能研究" maxlength="60"></div>
    <div class="fg"><label>构想归属 <small>· 显示在卡片上，选错了可以在这里改正</small></label>
      <select id="f-author" style="width:100%;background:rgba(255,255,255,.055);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14.5px;padding:11px 13px;font-family:inherit;outline:none"></select>
    </div>
    <div class="fg"><label>社会现象</label><textarea id="f-phen" placeholder="你观察到的真实现象、数据、新闻或身边案例……"></textarea></div>
    <div class="fg"><label>研究前提</label><textarea id="f-premise" placeholder="该现象成立的前提条件、已有研究或政策背景……"></textarea></div>
    <div class="fg"><label>研究思路</label><textarea id="f-method" placeholder="打算怎么做：数据来源、分析方法（文本分析/机器学习/空间分析等）……"></textarea></div>
    <div class="fg"><label>研究案例</label><textarea id="f-case" placeholder="可以对标的城市、政策、平台或典型事件……"></textarea></div>
    <div class="fg"><label>要解决的治理问题</label><textarea id="f-gov" placeholder="这个研究回应什么公共治理痛点？政策建议指向哪里？"></textarea></div>
    <div class="sheet-actions">
      <button class="sa-cancel" onclick="closeForm()">取消</button>
      <button class="sa-save" id="saveBtn" onclick="saveCard()">保存到云端</button>
    </div>
  </div>
</div>

<div class="modal" id="exportModal">
  <div class="sheet">
    <h3>📤 全部构想汇总</h3>
    <div class="sub">点击「复制全文」粘贴到群聊或文档 · <span id="exportCount"></span></div>
    <textarea class="export-box" id="exportBox" readonly></textarea>
    <div class="sheet-actions" style="margin-top:12px">
      <button class="sa-cancel" onclick="closeExport()">关闭</button>
      <button class="sa-save" onclick="copyExport()">复制全文</button>
    </div>
  </div>
</div>

<!-- 版本历史 -->
<div class="modal" id="historyModal">
  <div class="sheet">
    <h3>🕓 版本历史</h3>
    <div class="sub" id="historySub"></div>
    <div id="historyList"></div>
    <div class="sheet-actions" style="margin-top:14px">
      <button class="sa-cancel" onclick="closeHistory()">关闭</button>
    </div>
  </div>
</div>

<!-- 版本详情 -->
<div class="modal" id="versionModal">
  <div class="sheet">
    <h3 id="versionTitle">历史版本</h3>
    <div class="sub" id="versionSub"></div>
    <div id="versionBody" style="max-height:46vh;overflow-y:auto"></div>
    <div class="sheet-actions" style="margin-top:14px">
      <button class="sa-cancel" onclick="document.getElementById('versionModal').classList.remove('show')">关闭</button>
      <button class="sa-save" id="restoreBtn" onclick="restoreVersion()">↩️ 恢复此版本</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 配置 ================= */
var CONFIG = {
  backend: "github",
  github: { owner:"wuxuancheng66", repo:"gba-themes", branch:"main", token:"", api:"https://api.github.com" }
};
var PEOPLE = ["吴宣澄","马云启","王子恒","朱鑫林","庄竞泽"];
var COLORS = {"吴宣澄":"#4f8cff","马云启":"#34d399","王子恒":"#f5b93d","朱鑫林":"#f472b6","庄竞泽":"#8b5cf6"};

var state = { me: localStorage.getItem("me") || "", cards: [], sha: null, editingId: null, timer: null, tokenReady: null };

/* 启动时从数据仓 config.json 获取专用令牌（jsDelivr 主通道 + API 备通道） */
function fetchToken(){
  if (state.tokenReady) return state.tokenReady;
  state.tokenReady = fetch("https://cdn.jsdelivr.net/gh/wuxuancheng66/gba-themes@main/config.json?t=" + Date.now())
    .then(function(r){ if (!r.ok) throw new Error("cdn"); return r.json(); })
    .catch(function(){
      return fetch("https://api.github.com/repos/wuxuancheng66/gba-themes/contents/config.json?t=" + Date.now())
        .then(function(r){ return r.json(); })
        .then(function(j){
          var txt = decodeURIComponent(escape(atob((j.content || "").replace(/\n/g, ""))));
          return JSON.parse(txt);
        });
    })
    .then(function(cfg){
      if (cfg.k) {
        CONFIG.github.token = cfg.k.split("").map(function(c){ return String.fromCharCode(c.charCodeAt(0) - 3); }).join("");
      } else if (cfg.t) {
        CONFIG.github.token = atob(cfg.t);
      } else {
        CONFIG.github.token = cfg.token;
      }
      return CONFIG.github.token;
    });
  return state.tokenReady;
}

/* ================= 后端适配 ================= */
function backend(){ return CONFIG[CONFIG.backend]; }

function apiRead(){
  var b = backend();
  return fetchToken().then(function(){
    var url = b.api + "/repos/" + b.owner + "/" + b.repo + "/contents/data.json?ref=" + b.branch + "&t=" + Date.now();
    var headers = { "Authorization": "token " + b.token, "Accept": "application/vnd.github+json" };
    return fetch(url, { headers: headers, cache: "no-store" });
  }).then(function(r){
    if (r.status === 404) return { json: { cards: [] }, sha: null };
    if (!r.ok) throw new Error("读取失败 HTTP " + r.status);
    return r.json().then(function(j){
      var txt = decodeURIComponent(escape(atob((j.content || "").replace(/\n/g, ""))));
      return { json: JSON.parse(txt || '{"cards":[]}'), sha: j.sha };
    });
  });
}

function apiWrite(cards, sha){
  return fetchToken().then(function(){
    var b = backend();
    var content = btoa(unescape(encodeURIComponent(JSON.stringify({ cards: cards }, null, 1))));
    var body = { message: "更新主题构想 " + new Date().toLocaleString("zh-CN"), content: content, branch: b.branch };
    if (sha) body.sha = sha;
    var url = b.api + "/repos/" + b.owner + "/" + b.repo + "/contents/data.json";
    var opts = {
      method: "PUT",
      headers: { "Authorization": "token " + b.token, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify(body)
    };
    return fetch(url, opts).then(function(r){
      if (!r.ok) throw new Error("保存失败 HTTP " + r.status);
      return r.json();
    });
  });
}

/* ================= 数据加载 ================= */
function setDot(cls){
  var d = document.getElementById("syncDot");
  d.className = "sync-dot" + (cls ? " " + cls : "");
}

function loadData(showToast){
  setDot("off");
  return apiRead().then(function(res){
    state.cards = (res.json.cards || []).sort(function(a, b){ return (b.updateAt || "").localeCompare(a.updateAt || ""); });
    state.sha = res.sha;
    setDot("");
    render();
    if (showToast) toast("已同步 · 共 " + state.cards.length + " 条", "ok");
  }).catch(function(e){
    setDot("err");
    if (showToast) toast("⚠️ " + e.message, "err");
  });
}

function saveCard(){
  var title = document.getElementById("f-title").value.trim();
  if (!title) { toast("主题名必填", "err"); return; }
  var me = state.me || "吴宣澄";
  var now = new Date().toISOString();
  var old = state.editingId ? findCard(state.editingId) : null;
  var newAuthor = document.getElementById("f-author").value || (old ? old.author : me);
  var card = {
    id: state.editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2, 6)),
    title: title,
    phen: document.getElementById("f-phen").value.trim(),
    premise: document.getElementById("f-premise").value.trim(),
    method: document.getElementById("f-method").value.trim(),
    case_: document.getElementById("f-case").value.trim(),
    gov: document.getElementById("f-gov").value.trim(),
    author: newAuthor,
    lastEditor: me,
    createAt: old ? old.createAt : now,
    updateAt: now
  };
  /* 版本历史：编辑时把旧版本存档（每卡保留最近 20 版） */
  if (old && old.id) {
    var history = (old.history || []).slice();
    history.unshift({
      savedAt: old.updateAt || now,
      savedBy: old.lastEditor || old.author || me,
      title: old.title, phen: old.phen, premise: old.premise,
      method: old.method, case_: old.case_, gov: old.gov, author: old.author
    });
    card.history = history.slice(0, 20);
    if (old.author !== newAuthor) card.authorFixedBy = me;
  }
  var btn = document.getElementById("saveBtn");
  btn.disabled = true; btn.textContent = "保存中…";

  apiRead().then(function(res){
    var remote = (res.json.cards || []);
    var remoteOld = remote.find(function(c){ return c.id === card.id; });
    if (remoteOld && old && (remoteOld.updateAt || "") > (old.updateAt || "")) {
      /* 远端比本地看到的新：先把远端版本也存进历史，避免覆盖丢改 */
      var h2 = (card.history || []).slice();
      h2.unshift({ savedAt: remoteOld.updateAt, savedBy: remoteOld.lastEditor || remoteOld.author, title: remoteOld.title, phen: remoteOld.phen, premise: remoteOld.premise, method: remoteOld.method, case_: remoteOld.case_, gov: remoteOld.gov, author: remoteOld.author });
      card.history = h2.slice(0, 20);
    }
    var merged = remote.filter(function(c){ return c.id !== card.id; });
    merged.push(card);
    return apiWrite(merged, res.sha);
  }).then(function(){
    closeForm();
    toast("✅ 已保存，其他人 10 秒内可见", "ok");
    return loadData();
  }).catch(function(e){
    toast("⚠️ " + e.message + "（可稍后重试）", "err");
  }).finally(function(){
    btn.disabled = false; btn.textContent = "保存到云端";
  });
}

function delCard(id){
  var c = findCard(id);
  if (!confirm("删除「" + c.title + "」？此操作不可恢复")) return;
  apiRead().then(function(res){
    var merged = (res.json.cards || []).filter(function(x){ return x.id !== id; });
    return apiWrite(merged, res.sha);
  }).then(function(){ toast("已删除", "ok"); return loadData(); })
    .catch(function(e){ toast("⚠️ " + e.message, "err"); });
}

function findCard(id){
  for (var i = 0; i < state.cards.length; i++) if (state.cards[i].id === id) return state.cards[i];
  return {};
}

/* ================= 渲染 ================= */
function renderPeople(){
  var bar = document.getElementById("peopleBar");
  bar.innerHTML = "";
  PEOPLE.forEach(function(p){
    var n = state.cards.filter(function(c){ return c.author === p; }).length;
    var el = document.createElement("div");
    el.className = "person" + (state.me === p ? " sel" : "");
    el.innerHTML = '<div class="av" style="background:' + COLORS[p] + '">' + p[1] + '</div><div class="nm">' + p + '</div><div class="ct">' + n + '</div>';
    el.onclick = function(){
      state.me = p; localStorage.setItem("me", p); renderPeople(); toast("当前身份：" + p, "ok");
    };
    bar.appendChild(el);
  });
}

var FIELD_LABELS = [["phen","社会现象"],["premise","研究前提"],["method","研究思路"],["case_","研究案例"],["gov","要解决的治理问题"]];

/* 示例引导卡：按历届获奖作品口径撰写，展示"好构想"的样子 */
var EXAMPLE_CARD = {
  title: "AI 客服替代政务热线后的话务效能与公众满意度研究",
  phen: "多地 12345 政务热线引入 AI 语音客服：某省会城市试点后人工坐席缩减 40%，热线接通率从 71% 升至 95%；但社交媒体上「转人工难」的投诉同比上升 65%，老年群体反映尤为集中。接通率与满意度的「一升一降」背后，是智能替代与公共服务可及性之间的治理张力。",
  premise: "「人工智能+」行动要求提高政府治理数智化水平；《政务热线服务规范》国家标准对接通率、办结率、满意度设有硬指标；已有研究多聚焦技术采纳意愿，缺少对「AI 替代后效能如何再分配」的实证检验。",
  method: "① 爬取该市 2023–2026 年 12345 话务公开月度数据（接通率/办理时长/满意率）；② 抓取微博与领导留言板约 2 万条相关文本，用情感分析刻画公众态度的时间变化；③ 以 AI 上线时点为界做前后对比分析；④ 30 个电话回访样本做质性补充，重点覆盖老年 callers。",
  case_: "可对标：广州市 12345 与政务直播联动实践、北京市「接诉即办」数据公开、新加坡政府聊天机器人的「AI 分流＋人工兜底」双层设计。",
  gov: "回答「AI 替代人工在政务服务中是否、以及在何种条件下提升整体效能」，为热线 AI 化的推进节奏、人工兜底机制、考核指标从「接通率」转向「问题解决率」提供政策建议。"
};

function esc(s){ var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

function render(){
  renderPeople();
  var grid = document.getElementById("cardsGrid");
  grid.innerHTML = "";
  document.getElementById("emptyTip").style.display = "none";
  /* 示例引导卡（始终置顶，不入云端数据） */
  var ex = document.createElement("div");
  ex.className = "card example";
  ex.style.setProperty("--pc", "#f5b93d");
  var exFields = FIELD_LABELS.map(function(f){
    return '<div class="f"><div class="k">' + f[1] + '</div><div class="v">' + esc(EXAMPLE_CARD[f[0]]) + '</div></div>';
  }).join("");
  ex.innerHTML =
    '<div class="head"><h3>' + esc(EXAMPLE_CARD.title) + '</h3><span class="example-badge">📌 示例</span></div>' +
    '<div class="meta"><span class="who" style="color:var(--gold)">示范口径</span><span>·</span><span>参考历届获奖作品写法</span></div>' +
    '<div class="example-fields">' + exFields + '</div>' +
    '<div class="example-card-tag">💡 好构想的共性：真实数据感（有数字）· 方法具体可落地 · 有对标案例 · 政策出口清晰</div>' +
    '<div class="ops"><button onclick="useExample()">📋 参考它写一张</button></div>';
  grid.appendChild(ex);
  if (!state.cards.length) {
    var tip = document.getElementById("emptyTip");
    tip.style.display = "block";
    tip.innerHTML = "还没有人提交构想——点击下方「＋ 新的构想」<br>或点上方示例卡的「📋 参考它写一张」开始 ✍️";
  }
  state.cards.forEach(function(c){
    var el = document.createElement("div");
    el.className = "card"; el.style.setProperty("--pc", COLORS[c.author] || "#4f8cff");
    var fieldsHtml = FIELD_LABELS.map(function(f){
      if (!c[f[0]]) return "";
      return '<div class="f"><div class="k">' + f[1] + '</div><div class="v">' + esc(c[f[0]]) + '</div></div>';
    }).join("");
    var hasMore = fieldsHtml !== "";
    el.innerHTML =
      '<div class="head"><h3>' + esc(c.title) + '</h3></div>' +
      '<div class="meta"><span class="who">' + esc(c.author) + '</span><span>·</span><span>' + fmtTime(c.updateAt) + '更新' +
      (c.lastEditor && c.lastEditor !== c.author ? '（' + esc(c.lastEditor) + '改）' : '') + '</span></div>' +
      '<div class="fields">' + fieldsHtml + '</div>' +
      (hasMore ? '<div class="toggle" onclick="this.parentNode.classList.toggle(\'open\')">展开 / 收起 ▾</div>' : '') +
      '<div class="ops"><button onclick="editCard(\'' + c.id + '\')">✏️ 编辑</button><button onclick="showHistory(\'' + c.id + '\')">🕓 历史' + ((c.history && c.history.length) ? '(' + c.history.length + ')' : '') + '</button><button class="del" onclick="delCard(\'' + c.id + '\')">🗑 删除</button></div>';
    grid.appendChild(el);
  });
}

function fmtTime(iso){
  if (!iso) return "";
  var d = new Date(iso);
  return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

/* ================= 表单 ================= */
function openForm(id){
  state.editingId = id || null;
  var c = id ? findCard(id) : {};
  /* 作者下拉：5 人可选（改正归属用） */
  var sel = document.getElementById("f-author");
  sel.innerHTML = "";
  PEOPLE.forEach(function(p){
    var opt = document.createElement("option");
    opt.value = p; opt.textContent = p;
    sel.appendChild(opt);
  });
  var author = c.author || state.me || PEOPLE[0];
  sel.value = PEOPLE.includes(author) ? author : PEOPLE[0];
  document.getElementById("formTitle").textContent = id ? "编辑构想" : "新的主题构想";
  document.getElementById("formSub").textContent = id ? "最后由 " + (c.lastEditor || c.author || "") + " 修改于 " + fmtTime(c.updateAt) + "（可继续优化，旧版本自动存档）" : "当前身份：" + (state.me || "未选择（默认吴宣澄）");
  document.getElementById("f-title").value = c.title || "";
  document.getElementById("f-phen").value = c.phen || "";
  document.getElementById("f-premise").value = c.premise || "";
  document.getElementById("f-method").value = c.method || "";
  document.getElementById("f-case").value = c.case_ || "";
  document.getElementById("f-gov").value = c.gov || "";
  document.getElementById("formModal").classList.add("show");
}
function editCard(id){ openForm(id); }

/* ================= 版本历史 ================= */
var historyCardId = null, restoreTarget = null;

function showHistory(id){
  var c = findCard(id);
  historyCardId = id;
  var list = c.history || [];
  document.getElementById("historySub").textContent = "「" + c.title + "」共 " + list.length + " 个历史版本 · 当前版始终为最新";
  var box = document.getElementById("historyList");
  box.innerHTML = "";
  if (!list.length) {
    box.innerHTML = '<div style="color:var(--muted);font-size:13.5px;text-align:center;padding:26px 0">这张卡片还没有修改记录<br>每次编辑保存都会自动生成一个存档版本</div>';
  }
  list.forEach(function(v, i){
    var el = document.createElement("div");
    el.style.cssText = "display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:rgba(255,255,255,.035)";
    el.innerHTML =
      '<div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(v.title) + '</div>' +
      '<div style="font-size:11.5px;color:var(--muted)">' + fmtTime(v.savedAt) + ' · ' + esc(v.savedBy || "?") + ' 保存 · 归属 ' + esc(v.author || "?") + '</div></div>' +
      '<button style="border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);font-size:12px;padding:5px 12px;border-radius:8px;cursor:pointer;flex:none" onclick="showVersion(' + i + ')">查看</button>';
    box.appendChild(el);
  });
  document.getElementById("historyModal").classList.add("show");
}
function closeHistory(){ document.getElementById("historyModal").classList.remove("show"); }

function showVersion(i){
  var c = findCard(historyCardId);
  var v = (c.history || [])[i];
  if (!v) return;
  restoreTarget = { id: historyCardId, version: v };
  document.getElementById("versionTitle").textContent = v.title;
  document.getElementById("versionSub").textContent = fmtTime(v.savedAt) + " 由 " + (v.savedBy || "?") + " 保存";
  var body = document.getElementById("versionBody");
  var html = "";
  FIELD_LABELS.forEach(function(f){
    if (!v[f[0]]) return;
    html += '<div class="f"><div class="k">' + f[1] + '</div><div class="v">' + esc(v[f[0]]) + '</div></div>';
  });
  body.innerHTML = html + '<div style="font-size:11.5px;color:var(--muted);margin-top:6px">归属：' + esc(v.author || "?") + '</div>';
  document.getElementById("historyModal").classList.remove("show");
  document.getElementById("versionModal").classList.add("show");
}

function restoreVersion(){
  if (!restoreTarget) return;
  var t = restoreTarget;
  var me = state.me || "吴宣澄";
  var now = new Date().toISOString();
  var btn = document.getElementById("restoreBtn");
  btn.disabled = true; btn.textContent = "恢复中…";
  apiRead().then(function(res){
    var remote = (res.json.cards || []);
    var cur = remote.find(function(c){ return c.id === t.id; });
    if (!cur) throw new Error("卡片已不存在");
    var history = (cur.history || []).slice();
    history.unshift({ savedAt: cur.updateAt, savedBy: cur.lastEditor || cur.author, title: cur.title, phen: cur.phen, premise: cur.premise, method: cur.method, case_: cur.case_, gov: cur.gov, author: cur.author });
    cur.title = t.version.title; cur.phen = t.version.phen; cur.premise = t.version.premise;
    cur.method = t.version.method; cur.case_ = t.version.case_; cur.gov = t.version.gov;
    if (t.version.author) cur.author = t.version.author;
    cur.lastEditor = me + "（恢复历史版）";
    cur.updateAt = now;
    cur.history = history.slice(0, 20);
    return apiWrite(remote, res.sha);
  }).then(function(){
    document.getElementById("versionModal").classList.remove("show");
    toast("✅ 已恢复到历史版本", "ok");
    return loadData();
  }).catch(function(e){ toast("⚠️ " + e.message, "err"); })
  .finally(function(){ btn.disabled = false; btn.textContent = "↩️ 恢复此版本"; });
}

function useExample(){
  state.editingId = null;
  document.getElementById("formTitle").textContent = "新的主题构想";
  document.getElementById("formSub").textContent = "已带入示例内容供参考，改成你自己的选题吧（当前身份：" + (state.me || "未选择") + "）";
  document.getElementById("f-title").value = "";
  document.getElementById("f-phen").value = EXAMPLE_CARD.phen;
  document.getElementById("f-premise").value = EXAMPLE_CARD.premise;
  document.getElementById("f-method").value = EXAMPLE_CARD.method;
  document.getElementById("f-case").value = EXAMPLE_CARD.case_;
  document.getElementById("f-gov").value = EXAMPLE_CARD.gov;
  document.getElementById("formModal").classList.add("show");
  document.getElementById("f-title").focus();
}
function closeForm(){ document.getElementById("formModal").classList.remove("show"); }

function openExport(){
  var lines = [];
  PEOPLE.forEach(function(p){
    var mine = state.cards.filter(function(c){ return c.author === p; });
    if (!mine.length) return;
    lines.push("【" + p + "】(" + mine.length + "条)");
    mine.forEach(function(c, i){
      lines.push((i + 1) + ". " + c.title);
      FIELD_LABELS.forEach(function(f){ if (c[f[0]]) lines.push("   " + f[1] + "：" + c[f[0]]); });
    });
    lines.push("");
  });
  document.getElementById("exportCount").textContent = "共 " + state.cards.length + " 条构想";
  document.getElementById("exportBox").value = lines.join("\n") || "（暂无内容）";
  document.getElementById("exportModal").classList.add("show");
}
function closeExport(){ document.getElementById("exportModal").classList.remove("show"); }
function copyExport(){
  var box = document.getElementById("exportBox");
  box.select();
  if (navigator.clipboard) navigator.clipboard.writeText(box.value).then(function(){ toast("已复制", "ok"); });
  else { document.execCommand("copy"); toast("已复制", "ok"); }
}

function toast(msg, cls){
  var t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show " + (cls || "");
  clearTimeout(t._h); t._h = setTimeout(function(){ t.className = "toast " + (cls || ""); }, 2600);
}

/* ================= 启动 ================= */
if (!PEOPLE.includes(state.me)) state.me = "";
loadData();
state.timer = setInterval(function(){ if (document.visibilityState === "visible") loadData(); }, 10000);
document.addEventListener("visibilitychange", function(){ if (!document.hidden) loadData(); });
</script>
